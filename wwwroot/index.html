<!DOCTYPE html>
<html>
<head>
    <title>QR Scanner Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }

        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 13px;
            color: #888;
            font-style: italic;
        }

        .card {
            display: inline-block;
            padding: 15px;
            margin-right: 10px;
            border-radius: 10px;
            color: white;
            width: 150px;
            text-align: center;
        }

        .match { background: green; }
        .notmatch { background: red; }
        .failed { background: gray; }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
            font-size: 12px;
        }

        th { background-color: #eee; }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="top-right">
    Internship Teknik Instrumentasi
    Institut Teknologi Sepuluh Nopember 2026
</div>

<h2>QR Scanner Dashboard</h2>

<!--UPLOAD-->
<input type="file" id="fileInput" />
<button onclick="uploadFile()">Upload Datasheet</button>

<br><br>

<button onclick="downloadCSV()">Download CSV</button>
<button onclick="downloadExcel()">Download Excel</button>

<div style="margin-top:20px;">
    <div class="card match">MATCH<br><span id="matchCount">0</span></div>
    <div class="card notmatch">NOT MATCH<br><span id="notMatchCount">0</span></div>
    <div class="card failed">FAILED<br><span id="failedCount">0</span></div>
</div>

<!-- 🔥 TABLE BARU (PAIR FORMAT) -->
<table id="table">
    <thead>
        <tr>
            <th>Time</th>
            <th>Camera 1</th>
            <th>Status</th>
            <th>Camera 2</th>
            <th>Status</th>
            <th>Code Excel</th>
            <th>Pair Result</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
window.onload = function () {
    loadData();
    setInterval(loadData, 2000);
};

async function loadData() {
    try {
        const res = await fetch("https://syngenta-api-production.up.railway.app/api/scanresults");
        const data = await res.json();

        const tbody = document.querySelector("#table tbody");
        tbody.innerHTML = "";

        let match = 0, notmatch = 0, failed = 0;

        for (let i = 0; i < data.length - 2; i++) {
            const cam1 = data[i + 2];
            const cam2 = data[i + 1];
            const pair = data[i];

            if (
                cam1.camera === "CAMERA-01" &&
                cam2.camera === "CAMERA-02" &&
                pair.camera === "PAIR"
            ) {
                if (pair.status === "MATCH") match++;
                else if (pair.status === "NOT MATCH") notmatch++;
                else failed++;

                const row = `
                    <tr>
                        <td>${new Date(pair.time).toLocaleString('id-ID')}</td>
                        <td>${cam1.qr ?? '-'}</td>
                        <td>${cam1.status}</td>
                        <td>${cam2.qr ?? '-'}</td>
                        <td>${cam2.status}</td>
                        <td>${pair.qr ?? '-'}</td>
                        <td>${pair.status}</td>
                    </tr>
                `;

                tbody.innerHTML += row;

                i += 2;
            }
        }

        document.getElementById("matchCount").innerText = match;
        document.getElementById("notMatchCount").innerText = notmatch;
        document.getElementById("failedCount").innerText = failed;

    } catch (err) {
        console.error("ERROR:", err);
    }
}

function downloadCSV() {
    window.open("https://syngenta-api-production.up.railway.app/api/scanresults/export");
}

function downloadExcel() {
    window.open("https://syngenta-api-production.up.railway.app/api/scanresults/export-excel");
}

// UPLOAD
async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!file) {
        alert("Pilih file dulu!");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    try {
        const res = await fetch("https://syngenta-api-production.up.railway.app/api/scanresults/upload", {
            method: "POST",
            body: formData
        });

        const text = await res.text();
        alert("Upload sukses: " + text);
    } catch (err) {
        console.error(err);
        alert("Upload gagal!");
    }
}
</script>

</body>
</html>
