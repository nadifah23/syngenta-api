<!DOCTYPE html>
<html>
<head>
    <title>PACKING SCANNER</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }

        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 13px;
            color: #888;
            font-style: italic;
            text-align: right;
        }

        /* 🔥 LOGO */
        .top-left {
            position: absolute;
            top: 15px;
            left: 20px;
        }

        .top-left img {
            height: 50px;
        }

        .card {
            display: inline-block;
            padding: 15px;
            margin-right: 10px;
            border-radius: 10px;
            color: white;
            width: 150px;
            text-align: center;
        }

        .match { background: green; }
        .notmatch { background: red; }
        .failed { background: gray; }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
            font-size: 12px;
        }

        th { background-color: #eee; }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 🔥 LOGO (GANTI src NANTI) -->
<div class="top-left">
    <img src="logo.png" alt="Logo">
</div>

<!-- 🔥 TEXT KANAN -->
<div class="top-right">
    Internship Teknik Instrumentasi<br>
    Institut Teknologi Sepuluh Nopember 2026<br><br>
    
    <span style="font-size:12px; color:#555;">
        <b>Created by:</b><br>
        Fadiah Arika N<br>
        Syafira Aurelia A
    </span>
</div>

<h2>PACKING SCANNER</h2>

<input type="file" id="fileInput" />
<button onclick="uploadFile()">Upload Datasheet</button>

<br><br>

<button onclick="downloadCSV()">Download CSV</button>
<button onclick="downloadExcel()">Download Excel</button>
<button onclick="clearData()" style="background:red;color:white;">Hapus History</button>

<div style="margin-top:20px;">
    <div class="card match">MATCH<br><span id="matchCount">0</span></div>
    <div class="card notmatch">NOT MATCH<br><span id="notMatchCount">0</span></div>
    <div class="card failed">FAILED<br><span id="failedCount">0</span></div>
</div>

<table id="table">
    <thead>
        <tr>
            <th>Time</th>
            <th>Camera 1</th>
            <th>Status</th>
            <th>Camera 2</th>
            <th>Status</th>
            <th>Code Excel</th>
            <th>Pair Result</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
window.onload = function () {
    loadData();
    setInterval(loadData, 2000);
};

async function loadData() {
    try {
        const res = await fetch("https://syngenta-api-production.up.railway.app/api/scanresults", {
            cache: "no-store"
        });

        const data = (await res.json()).reverse();

        const tbody = document.querySelector("#table tbody");
        tbody.innerHTML = "";

        let match = 0, notmatch = 0, failed = 0;

        const pairs = data.filter(x => x.camera === "PAIR");

        for (let pair of pairs) {

            const related = data.filter(x =>
                x.camera !== "PAIR" &&
                new Date(x.time) <= new Date(pair.time)
            );

            const cam1 = related.find(x => x.camera === "CAMERA-01");
            const cam2 = related.find(x => x.camera === "CAMERA-02");

            if (!cam1 || !cam2) continue;

            if (pair.status === "MATCH") match++;
            else if (pair.status === "NOT MATCH") notmatch++;
            else failed++;

            const color =
                pair.status === "MATCH" ? "green" :
                pair.status === "NOT MATCH" ? "red" : "gray";

            const row = `
                <tr>
                    <td>${new Date(pair.time).toLocaleString('id-ID')}</td>
                    <td>${cam1.qr ?? '-'}</td>
                    <td>${cam1.status}</td>
                    <td>${cam2.qr ?? '-'}</td>
                    <td>${cam2.status}</td>
                    <td>${pair.qr ?? '-'}</td>
                    <td style="color:${color}; font-weight:bold;">
                        ${pair.status}
                    </td>
                </tr>
            `;

            tbody.innerHTML += row;
        }

        document.getElementById("matchCount").innerText = match;
        document.getElementById("notMatchCount").innerText = notmatch;
        document.getElementById("failedCount").innerText = failed;

    } catch (err) {
        console.error("ERROR:", err);
    }
}

function downloadCSV() {
    window.open("https://syngenta-api-production.up.railway.app/api/scanresults/export");
}

function downloadExcel() {
    window.open("https://syngenta-api-production.up.railway.app/api/scanresults/export-excel");
}

async function clearData() {
    if (!confirm("Yakin mau hapus semua data?")) return;

    try {
        const res = await fetch("https://syngenta-api-production.up.railway.app/api/scanresults/clear", {
            method: "DELETE"
        });

        const text = await res.text();
        alert(text);

        loadData();
    } catch (err) {
        console.error(err);
        alert("Gagal hapus data!");
    }
}

async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!file) {
        alert("Pilih file dulu!");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    try {
        const res = await fetch("https://syngenta-api-production.up.railway.app/api/scanresults/upload-txt", {
            method: "POST",
            body: formData
        });

        const text = await res.text();
        alert("Upload sukses: " + text);
    } catch (err) {
        console.error(err);
        alert("Upload gagal!");
    }
}
</script>

</body>
</html>
