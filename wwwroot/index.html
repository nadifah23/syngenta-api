<!DOCTYPE html>
<html>
<head>
    <title>QR Scanner Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }

        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 13px;
            color: #888;
            font-style: italic;
        }

        .card {
            display: inline-block;
            padding: 15px;
            margin-right: 10px;
            border-radius: 10px;
            color: white;
            width: 150px;
            text-align: center;
        }

        .match { background: green; }
        .notmatch { background: red; }
        .failed { background: gray; }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
            font-size: 12px;
        }

        th { background-color: #eee; }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
        }

        .tables {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .table-box {
            width: 33%;
        }
    </style>
</head>
<body>

<div class="top-right">
    Internship Teknik Instrumentasi
    Institut Teknologi Sepuluh Nopember 2026
    </div>

<h2>QR Scanner Dashboard</h2>

<!--UPLOAD-->
<input type="file" id="fileInput" />
<button onclick="uploadFile()">Upload Datasheet</button>

<br><br>

<button onclick="downloadCSV()">Download CSV</button>
<button onclick="downloadExcel()">Download Excel</button>

<div style="margin-top:20px;">
    <div class="card match">MATCH<br><span id="matchCount">0</span></div>
    <div class="card notmatch">NOT MATCH<br><span id="notMatchCount">0</span></div>
    <div class="card failed">FAILED<br><span id="failedCount">0</span></div>
</div>

<!-- 3 TABLE -->
<div class="tables">

    <!-- CAMERA 1 -->
    <div class="table-box">
        <h3>CAMERA-01</h3>
        <table id="tableCam1">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>QR</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- CAMERA 2 -->
    <div class="table-box">
        <h3>CAMERA-02</h3>
        <table id="tableCam2">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>QR</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- PAIR -->
    <div class="table-box">
        <h3>PAIR RESULT</h3>
        <table id="tablePair">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>QR</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>
window.onload = function () {
    loadData();
    setInterval(loadData, 2000);
};

async function loadData() {
    try {
        const res = await fetch("https://syngenta-api-production.up.railway.app/api/scanresults");
        const data = await res.json();

        const cam1Body = document.querySelector("#tableCam1 tbody");
        const cam2Body = document.querySelector("#tableCam2 tbody");
        const pairBody = document.querySelector("#tablePair tbody");

        cam1Body.innerHTML = "";
        cam2Body.innerHTML = "";
        pairBody.innerHTML = "";

        let match = 0, notmatch = 0, failed = 0;

        data.forEach(item => {
            const time = new Date(item.time).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });

            if (item.camera === "CAMERA-01") {
                cam1Body.innerHTML += `
                    <tr>
                        <td>${time}</td>
                        <td>${item.qr ?? '-'}</td>
                    </tr>
                `;
            }

            else if (item.camera === "CAMERA-02") {
                cam2Body.innerHTML += `
                    <tr>
                        <td>${time}</td>
                        <td>${item.qr ?? '-'}</td>
                    </tr>
                `;
            }

            else if (item.camera === "PAIR") {
                let color = "";

                if (item.status === "MATCH") {
                    color = "lightgreen";
                    match++;
                } else if (item.status === "NOT MATCH") {
                    color = "salmon";
                    notmatch++;
                } else {
                    color = "lightgray";
                    failed++;
                }

                pairBody.innerHTML += `
                    <tr style="background:${color}">
                        <td>${time}</td>
                        <td>${item.qr ?? '-'}</td>
                        <td>${item.status}</td>
                    </tr>
                `;
            }
        });

        document.getElementById("matchCount").innerText = match;
        document.getElementById("notMatchCount").innerText = notmatch;
        document.getElementById("failedCount").innerText = failed;

    } catch (err) {
        console.error("ERROR:", err);
    }
}

function downloadCSV() {
    window.open("https://syngenta-api-production.up.railway.app/api/scanresults/export");
}

function downloadExcel() {
    window.open("https://syngenta-api-production.up.railway.app/api/scanresults/export-excel");
}

// UPLOAD
async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!file) {
        alert("Pilih file dulu!");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    try {
        const res = await fetch("https://syngenta-api-production.up.railway.app/api/scanresults/upload", {
            method: "POST",
            body: formData
        });

        const text = await res.text();
        alert("Upload sukses: " + text);
    } catch (err) {
        console.error(err);
        alert("Upload gagal!");
    }
}
</script>

</body>
</html>
